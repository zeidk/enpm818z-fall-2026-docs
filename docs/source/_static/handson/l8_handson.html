<h1>L8 hands-on: where will the others be?</h1>
<p class="lead">The same Python as <code>l8_handson.py</code> and <code>l8sim.py</code>, running in your browser
(numpy and matplotlib, no CARLA, no ROS). The first load downloads Python, so it takes a while.</p>

<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
<script>
const PARTS = [["scene", "Part 1: the scene", -2.0, ["Drag the <b>now</b> slider from &minus;2 to 3 s. The dots are the tracked positions the AV sees.", "At which time can you first tell, by eye, that car A is slowing down? That it turns?"]], ["physics", "Part 2: physics models", -0.5, ["At now = 0: read each model's error at 5 s in the right panel's title (FDE). Which is smallest, and why?", "Move now from 0 to 3.0 s, 0.5 s at a time. When does CTRV beat CV at 5 s? When does it lose?", "Where is CTRA worst: while A brakes, or while it speeds up after the turn?"]], ["modes", "Part 3: two futures", -0.5, ["Move the <b>now</b> slider from &minus;0.5 to 1.0 s. Watch the line widths (the probabilities) and P(left) on the right.", "In the <b>l8sim.py</b> tab, set <code>SIG_V = 0.5</code>, then <code>2.0</code>. What happens to P(left) at t = 0, and why?", "Set <code>A_LAT = 1.5</code>. Does the left mode's FDE go down? Why?"]], ["interact", "Part 4: drivers who react", -0.5, ["Run 1: compare B's speed from CV and from the IDM. At what time do the two speed curves start to differ?", "Tick <b>AV 24 m closer</b> (run 2). Read A's gap in the title. Which of the two \"most likely mode\" lines matches the truth?", "In the <b>l8sim.py</b> tab, set <code>GAP = 2.5</code>. What does A do in run 2 now? And car B, behind it?"]]];
const SRC = {"l8sim": "\"\"\"L8 shared code: one Town01 junction, its road users, and the predictors.\n\nEverything here runs with numpy alone. The lanes come from l8_scene.npz, which\nexport_scene.py wrote from Town01.xodr through carla.Map (no CARLA server).\n\nMap frame: x east, y north, meters (CARLA's y is flipped, as in lecture6).\nTime: t = 0 is \"now\", the moment we predict from. The track before it is the\nhistory the predictors may read; the truth after it is what they must guess.\n\nEvery number below is chosen for the lecture, and says so. The lecture's\nmeasured numbers come from running this file (see the slides' measured.json).\n\"\"\"\nimport zlib\nfrom pathlib import Path\n\nimport numpy as np\n\nHERE = Path(__file__).resolve().parent\n\n# ----------------------------------------------------------------- chosen settings\nDT = 0.1          # s between tracked positions (10 Hz, chosen)\nHIST = 2.0        # s of track history a predictor may read (chosen)\nFIT = 1.5         # s of the newest history used to fit velocity and acceleration (chosen)\nHORIZON = 5.0     # s predicted (chosen)\nNOISE = 0.05      # m, 1 sigma of each tracked position, per axis, after the tracker (chosen)\nCAR_LEN = 4.5     # m, every car (chosen, as in L5 and L6)\nV_CRUISE = 8.0    # m/s, cruising speed (chosen; GP4's default target_speed is 8.0)\nA_LAT = 2.0       # m/s^2, sideways acceleration a predictor assumes in a turn (chosen)\nMISS = 2.0        # m, a prediction misses when its final error is larger (Argoverse's threshold)\nSIG_V = 1.0       # m/s, how far a driver's speed may differ from a mode's (chosen)\nB_EXP = 1.0       # m/s^2, the braking we expect before a turn (chosen)\nSIG_TH = np.radians(8.0)   # rad, same for heading (chosen)\nSIG_LAT = 0.7     # m, same for the sideways offset from a lane's center (chosen)\nSIG_ACC = 0.5     # m/s per sqrt(s): how fast speed may wander, for CV's uncertainty (chosen)\nGAP = 4.1         # s, the shortest gap a left-turning driver accepts (critical gap)\nD_DECIDE = 6.0    # m before the junction where car A decides to turn or wait (chosen)\n\n# IDM, the Intelligent Driver Model (Treiber, Hennecke and Helbing 2000). The paper's\n# values for T, a, b, delta and s0; v0 is our street's (chosen).\nIDM = dict(v0=9.0, T=1.6, a=0.73, b=1.67, delta=4.0, s0=2.0)\n\n# The moves through the junction, named by the direction of travel before and after.\nMOVES = {\n    \"west_to_west\": \"westbound, straight on\",\n    \"west_to_south\": \"westbound, left turn\",\n    \"east_to_east\": \"eastbound, straight on\",\n    \"east_to_south\": \"eastbound, right turn\",\n    \"north_to_west\": \"northbound, left turn\",\n    \"north_to_east\": \"northbound, right turn\",\n}\nAPPROACH = {\"west\": (\"west_to_west\", \"west_to_south\"),\n            \"east\": (\"east_to_east\", \"east_to_south\"),\n            \"north\": (\"north_to_west\", \"north_to_east\")}\n\n\ndef wrap(a):\n    return (np.asarray(a) + np.pi) % (2 * np.pi) - np.pi\n\n\n# ----------------------------------------------------------------- the map\nclass Lane:\n    \"\"\"One lane centerline as a polyline with arc length s (m) from its first point.\"\"\"\n\n    def __init__(self, pts):\n        pts = np.asarray(pts, float)\n        seg = np.hypot(*np.diff(pts, axis=0).T)\n        pts = pts[np.r_[True, seg > 1e-6]]\n        self.pts = pts\n        self.s = np.r_[0.0, np.cumsum(np.hypot(*np.diff(pts, axis=0).T))]\n        d = np.gradient(pts, self.s, axis=0)\n        self.heading = np.unwrap(np.arctan2(d[:, 1], d[:, 0]))\n        self.length = float(self.s[-1])\n\n    def at(self, s):\n        s = np.clip(s, 0.0, self.length)\n        return np.stack([np.interp(s, self.s, self.pts[:, 0]),\n                         np.interp(s, self.s, self.pts[:, 1])], axis=-1)\n\n    def heading_at(self, s):\n        return np.interp(np.clip(s, 0.0, self.length), self.s, self.heading)\n\n    def project(self, p):\n        \"\"\"Arc length of the nearest point, and the sideways offset (m, left positive).\"\"\"\n        p = np.asarray(p, float)\n        a, b = self.pts[:-1], self.pts[1:]\n        ab = b - a\n        u = np.clip(np.einsum(\"ij,ij->i\", p - a, ab) / np.einsum(\"ij,ij->i\", ab, ab), 0, 1)\n        q = a + u[:, None] * ab\n        d = np.hypot(*(p - q).T)\n        i = int(np.argmin(d))\n        s = self.s[i] + u[i] * (self.s[i + 1] - self.s[i])\n        side = np.sign(ab[i, 0] * (p[1] - a[i, 1]) - ab[i, 1] * (p[0] - a[i, 0]))\n        return float(s), float(side * d[i])\n\n\ndef load_scene(path=HERE / \"l8_scene.npz\"):\n    d = np.load(path)\n    lanes = {n[5:]: Lane(d[n]) for n in d.files if n.startswith(\"path_\")}\n    info = {}\n    for name, ln in lanes.items():\n        s_in = ln.project(d[f\"entry_{name}\"])[0]\n        s_out = ln.project(d[f\"exit_{name}\"])[0]\n        turn = float(wrap(ln.heading_at(s_out) - ln.heading_at(s_in)))\n        radius = (s_out - s_in) / abs(turn) if abs(turn) > np.radians(30) else np.inf\n        info[name] = dict(s_in=s_in, s_out=s_out, turn_deg=float(np.degrees(turn)),\n                          inside=float(s_out - s_in), radius=float(radius))\n    edges = [d[n] for n in sorted(d.files) if n.startswith(\"lane_\") and n != \"lane_in_junction\"]\n    return dict(lanes=lanes, info=info, edges=edges, edge_in_junction=d[\"lane_in_junction\"], window=d[\"window\"],\n                center=d[\"junction_center\"], source=str(d[\"source\"]))\n\n\ndef turn_speed(info, a_lat=A_LAT):\n    \"\"\"Speed through a turn of radius R with sideways acceleration a_lat: sqrt(a_lat R).\"\"\"\n    return float(np.sqrt(a_lat * info[\"radius\"])) if np.isfinite(info[\"radius\"]) else np.inf\n\n\ndef conflict_point(scene, a=\"west_to_south\", b=\"east_to_east\"):\n    \"\"\"Where two lanes' centerlines cross: arc length on each, and the point.\"\"\"\n    la, lb = scene[\"lanes\"][a], scene[\"lanes\"][b]\n    sa = np.arange(0, la.length, 0.05)\n    pa = la.at(sa)\n    best = (np.inf, 0, 0)\n    for i in range(0, len(sa), 4):\n        s, off = lb.project(pa[i])\n        if abs(off) < best[0]:\n            best = (abs(off), sa[i], s)\n    return dict(s_a=float(best[1]), s_b=float(best[2]), xy=la.at(best[1]))\n\n\n# ----------------------------------------------------------------- true motion\ndef drive(lane, info, s0, v0, t, b=1.0, v_turn=None, a_up=1.0, v_cruise=V_CRUISE,\n          wait=None, rng=None, wander=0.0):\n    \"\"\"A driver along one lane, stepped at 0.01 s, sampled at the times t (s).\n\n    Cruise at v_cruise; for a turn, brake at b to reach v_turn 1 m before the junction,\n    hold it to the junction's exit, then speed up at a_up. wait = (t_decide_s_before,\n    t_go): when the car is that many meters before the junction, it stops 1 m before\n    it and waits until time t_go (the gap-acceptance run). wander: 1 sigma (m/s^2) of a\n    slow random speed change (a driver never holds a speed exactly).\"\"\"\n    h = 0.01\n    tt = np.arange(t[0], t[-1] + h / 2, h)\n    s, v, acc = np.empty(len(tt)), np.empty(len(tt)), np.zeros(len(tt))\n    s[0], v[0] = s0, v0\n    turning = np.isfinite(info[\"radius\"])\n    if v_turn is None:\n        v_turn = turn_speed(info) if turning else v_cruise\n    stop_at = info[\"s_in\"] - 1.0\n    stopping = False\n    noise = 0.0\n    for k in range(len(tt) - 1):\n        sk, vk = s[k], v[k]\n        if wait is not None and not stopping and sk >= info[\"s_in\"] - wait[0] and tt[k] < wait[1]:\n            stopping = True\n        if stopping and tt[k] >= wait[1]:\n            stopping = False\n        if stopping:\n            d = max(stop_at - sk, 0.05)\n            a = -min(vk * vk / (2 * d), 6.0) if vk > 0.01 else -vk / h\n        elif turning and sk < info[\"s_out\"]:\n            target = v_turn\n            d = info[\"s_in\"] - 1.0 - sk\n            if vk > target and d > 0 and (vk * vk - target * target) / (2 * b) >= d:\n                a = -b\n            elif d <= 0:\n                a = np.clip((target - vk) / 0.5, -b, a_up)\n            elif vk < v_cruise and (vk * vk - target * target) / (2 * b) < d - 2.0:\n                a = min(a_up, (v_cruise - vk) / 0.5)\n            else:\n                a = max(-b, min(0.0, (v_cruise - vk) / 0.5))\n        else:\n            a = np.clip((v_cruise - vk) / 0.5, -b, a_up)\n        if wander and rng is not None:\n            noise += (-noise / 2.0) * h + wander * np.sqrt(h) * rng.standard_normal()\n            a += noise\n        acc[k] = a\n        v[k + 1] = max(vk + a * h, 0.0)\n        s[k + 1] = sk + 0.5 * (vk + v[k + 1]) * h\n    idx = np.clip(np.round((t - tt[0]) / h).astype(int), 0, len(tt) - 1)\n    return dict(t=t, s=s[idx], v=v[idx], a=acc[idx], xy=lane.at(s[idx]),\n                heading=lane.heading_at(s[idx]))\n\n\ndef idm_accel(v, gap, dv, p=IDM):\n    \"\"\"IDM: a [1 - (v/v0)^delta - (s*/s)^2], s* = s0 + v T + v dv / (2 sqrt(a b)).\"\"\"\n    s_star = p[\"s0\"] + max(0.0, v * p[\"T\"] + v * dv / (2 * np.sqrt(p[\"a\"] * p[\"b\"])))\n    free = 1 - (v / p[\"v0\"]) ** p[\"delta\"]\n    return p[\"a\"] * (free - (s_star / gap) ** 2 if np.isfinite(gap) else free)\n\n\ndef follow(lane, s0, v0, t, leader_xy, p=IDM):\n    \"\"\"A car on `lane` driven by the IDM behind a leader whose positions at times t are\n    leader_xy. The leader counts while it is ahead and within 1.5 m of the lane's center.\"\"\"\n    h = 0.01\n    tt = np.arange(t[0], t[-1] + h / 2, h)\n    lx = np.interp(tt, t, leader_xy[:, 0])\n    ly = np.interp(tt, t, leader_xy[:, 1])\n    s, v, acc = np.empty(len(tt)), np.empty(len(tt)), np.zeros(len(tt))\n    s[0], v[0] = s0, v0\n    sl_prev = None\n    for k in range(len(tt) - 1):\n        sl, off = lane.project((lx[k], ly[k]))\n        vl = 0.0 if sl_prev is None else (sl - sl_prev) / h\n        sl_prev = sl\n        gap = sl - s[k] - CAR_LEN if (abs(off) < 1.5 and sl > s[k]) else np.inf\n        a = idm_accel(v[k], max(gap, 0.1), v[k] - vl, p)\n        acc[k] = a\n        v[k + 1] = max(v[k] + a * h, 0.0)\n        s[k + 1] = s[k] + 0.5 * (v[k] + v[k + 1]) * h\n    idx = np.clip(np.round((t - tt[0]) / h).astype(int), 0, len(tt) - 1)\n    return dict(t=t, s=s[idx], v=v[idx], a=acc[idx], xy=lane.at(s[idx]),\n                heading=lane.heading_at(s[idx]))\n\n\ndef times(t0=-HIST, t1=HORIZON + 1.0):\n    return np.round(np.arange(t0, t1 + DT / 2, DT), 6)\n\n\ndef our_scene(scene=None, av_closer=0.0, seed=818):\n    \"\"\"The lecture's scene. Car A (westbound) turns left across the AV's lane; car B\n    follows A and goes straight on; the AV drives east at 8 m/s.\n\n    Chosen: A cruises at 8 m/s, brakes at 1.0 m/s^2 to 5.0 m/s for the turn, and \"now\"\n    (t = 0) is 2.0 s into that braking. A decides D_DECIDE m before the junction: it turns if the\n    AV is at least GAP seconds from where their lanes cross, else it stops and waits.\n    The AV is 6.0 s from that point when A decides; av_closer (m) moves it closer, for\n    the second run. B starts 24 m behind A at 8 m/s and follows it with the IDM.\"\"\"\n    scene = scene or load_scene()\n    la, ia = scene[\"lanes\"][\"west_to_south\"], scene[\"info\"][\"west_to_south\"]\n    lav, iav = scene[\"lanes\"][\"east_to_east\"], scene[\"info\"][\"east_to_east\"]\n    lb = scene[\"lanes\"][\"west_to_west\"]\n    t = times(-6.0, HORIZON + 3.0)\n    v_turn, b = 5.0, 1.0\n    s_brake = ia[\"s_in\"] - 1.0 - (V_CRUISE ** 2 - v_turn ** 2) / (2 * b)\n    s_a0 = s_brake - V_CRUISE * (6.0 - 2.0)          # brakes at t = -2.0 s\n    a_free = drive(la, ia, s_a0, V_CRUISE, t, b=b, v_turn=v_turn)\n    t_dec = float(np.interp(ia[\"s_in\"] - D_DECIDE, a_free[\"s\"], t))\n    cp = conflict_point(scene)\n    gap = 6.0 - av_closer / V_CRUISE\n    s_av0 = cp[\"s_b\"] - V_CRUISE * (t_dec - t[0] + 6.0) + av_closer\n    av = dict(t=t, s=s_av0 + V_CRUISE * (t - t[0]), v=np.full_like(t, V_CRUISE), a=np.zeros_like(t))\n    av[\"xy\"], av[\"heading\"] = lav.at(av[\"s\"]), lav.heading_at(av[\"s\"])\n    t_av_pass = float(np.interp(cp[\"s_b\"] + CAR_LEN, av[\"s\"], t))\n    if gap >= GAP:\n        a = a_free\n        went = True\n    else:\n        a = drive(la, ia, s_a0, V_CRUISE, t, b=b, v_turn=v_turn, wait=(D_DECIDE, t_av_pass + 1.0))\n        went = False\n    s_b0 = s_a0 - 24.0 - CAR_LEN\n    bcar = follow(lb, s_b0, V_CRUISE, t, a[\"xy\"])\n    rng = np.random.default_rng(seed)        # the noise is drawn from t = -6 s on, so the\n    for d in (a, bcar):                         # track does not depend on how much is kept\n        d[\"track\"] = d[\"xy\"] + NOISE * rng.standard_normal(d[\"xy\"].shape)\n    keep = t >= -HIST - 1e-9\n    out = {}\n    for name, d in ((\"A\", a), (\"B\", bcar), (\"AV\", av)):\n        out[name] = {k: (v[keep] if isinstance(v, np.ndarray) else v) for k, v in d.items()}\n    out[\"t\"] = t[keep]\n    out[\"meta\"] = dict(t_decide=t_dec, gap=gap, went=went, conflict=cp, t_av_pass=t_av_pass,\n                       v_turn=v_turn, brake=b, av_closer=av_closer)\n    return out\n\n\n# ----------------------------------------------------------------- reading the track\ndef fit_state(t, track, now=0.0, window=FIT):\n    \"\"\"Least-squares fit of p(t) = p0 + v t + a t^2 / 2 (t from now) to the track's last\n    `window` seconds. Returns the fitted position, velocity, acceleration, and from them\n    the speed, heading, yaw rate and the acceleration along the heading.\"\"\"\n    m = (t <= now + 1e-9) & (t >= now - window - 1e-9)\n    tau = t[m] - now\n    X = np.c_[np.ones_like(tau), tau, 0.5 * tau ** 2]\n    coef, *_ = np.linalg.lstsq(X, track[m], rcond=None)\n    p0, v, a = coef[0], coef[1], coef[2]\n    speed = float(np.hypot(*v))\n    heading = float(np.arctan2(v[1], v[0]))\n    omega = float((v[0] * a[1] - v[1] * a[0]) / max(speed ** 2, 1e-6))\n    a_along = float(v @ a / max(speed, 1e-6))\n    # the velocity's covariance from a straight-line fit, for CV's uncertainty\n    X1 = np.c_[np.ones_like(tau), tau]\n    cov1 = NOISE ** 2 * np.linalg.inv(X1.T @ X1)\n    return dict(p0=p0, v=v, a=a, speed=speed, heading=heading, omega=omega,\n                a_along=a_along, cov_pv=cov1, n=int(m.sum()))\n\n\ndef horizons(horizon=HORIZON):\n    return np.round(np.arange(DT, horizon + DT / 2, DT), 6)\n\n\n# ----------------------------------------------------------------- predictors\ndef predict_cv(st, h=None):\n    \"\"\"Constant velocity: p(h) = p0 + v h.\"\"\"\n    h = horizons() if h is None else h\n    return st[\"p0\"] + np.outer(h, st[\"v\"])\n\n\ndef predict_ctrv(st, h=None):\n    \"\"\"Constant turn rate and velocity: an arc of radius v / omega.\"\"\"\n    h = horizons() if h is None else h\n    v, th, w = st[\"speed\"], st[\"heading\"], st[\"omega\"]\n    if abs(w) < 1e-3:\n        return predict_cv(st, h)\n    x = st[\"p0\"][0] + v / w * (np.sin(th + w * h) - np.sin(th))\n    y = st[\"p0\"][1] + v / w * (np.cos(th) - np.cos(th + w * h))\n    return np.c_[x, y]\n\n\ndef predict_ctra(st, h=None):\n    \"\"\"Constant turn rate and acceleration (speed held at 0 once it reaches 0).\"\"\"\n    h = horizons() if h is None else h\n    step = 0.01\n    n = int(round(h[-1] / step))\n    p, v, th = st[\"p0\"].astype(float).copy(), st[\"speed\"], st[\"heading\"]\n    out, k = [], 0\n    for i in range(1, n + 1):\n        v2 = max(v + st[\"a_along\"] * step, 0.0)\n        p = p + 0.5 * (v + v2) * step * np.array([np.cos(th), np.sin(th)])\n        th += st[\"omega\"] * step if v2 > 0 else 0.0\n        v = v2\n        if k < len(h) and abs(i * step - h[k]) < step / 2:\n            out.append(p.copy())\n            k += 1\n    return np.array(out)\n\n\ndef cv_cov(st, h=None, sig_acc=SIG_ACC):\n    \"\"\"CV's position covariance at each horizon (the same for x and y): the fit's\n    position and velocity uncertainty carried forward, plus a speed that wanders by\n    sig_acc: var = var_p + 2 h cov_pv + h^2 var_v + sig_acc^2 h^3 / 3.\"\"\"\n    h = horizons() if h is None else h\n    c = st[\"cov_pv\"]\n    return c[0, 0] + 2 * h * c[0, 1] + h ** 2 * c[1, 1] + sig_acc ** 2 * h ** 3 / 3\n\n\ndef candidate_lanes(scene, p, heading, max_off=2.5, max_dth=np.radians(60)):\n    \"\"\"Every lane through the junction that the road user could be on now.\"\"\"\n    out = []\n    for name, ln in scene[\"lanes\"].items():\n        s, off = ln.project(p)\n        if abs(off) <= max_off and abs(wrap(heading - ln.heading_at(s))) <= max_dth:\n            out.append(name)\n    return out\n\n\ndef mode_plan(lane, info, s0, v0, h, a_lat=A_LAT, a_up=1.0, v_street=V_CRUISE):\n    \"\"\"One mode's future along its lane, as arc length s(h). For a turn: brake evenly to\n    sqrt(a_lat R) by the junction, hold that speed through it, then speed up at a_up to\n    the street's speed. Straight on: hold the speed. Also returns the braking the mode\n    expects now (m/s^2, negative = braking).\"\"\"\n    if not (np.isfinite(info[\"radius\"]) and s0 < info[\"s_out\"]):\n        return s0 + v0 * h, 0.0\n    vt = turn_speed(info, a_lat)\n    step = 0.01\n    n = int(round(h[-1] / step))\n    d = info[\"s_in\"] - s0\n    b = (v0 ** 2 - vt ** 2) / (2 * d) if (v0 > vt and d > 0.5) else 0.0\n    s, v, out, k = s0, v0, [], 0\n    for i in range(1, n + 1):\n        if s < info[\"s_in\"] and v > vt and b > 0:\n            a = -b\n        elif s < info[\"s_out\"]:\n            a = np.clip((min(v0, vt) - v) / 0.5, -2.0, a_up)\n        else:\n            a = min(a_up, max(v_street - v, 0.0) / 0.5)\n        v2 = max(v + a * step, 0.0)\n        s += 0.5 * (v + v2) * step\n        v = v2\n        if k < len(h) and abs(i * step - h[k]) < step / 2:\n            out.append(s)\n            k += 1\n    return np.array(out), -b\n\n\ndef wait_plan(lane, info, s0, v0, h, t_go, a_up=1.0, a_lat=A_LAT):\n    \"\"\"A left turn that waits: stop 1 m before the junction, wait until t_go (s from\n    now), then go through the turn at sqrt(a_lat R).\"\"\"\n    t = np.r_[0.0, h]\n    d = drive(lane, info, s0, v0, t, b=1.0, v_turn=turn_speed(info, a_lat), a_up=a_up,\n              wait=(1e9, t_go))\n    return d[\"s\"][1:]\n\n\ndef gauss(x, sig):\n    return np.exp(-0.5 * (x / sig) ** 2)\n\n\ndef expected_speed(info, s0, v_street=V_CRUISE, b=B_EXP, a_lat=A_LAT):\n    \"\"\"The speed a mode expects here. Straight on: the street's speed. A turn: at most\n    sqrt(a_lat R) in the junction, and before it, the speed from which braking at b\n    reaches that by the junction: sqrt(v_turn^2 + 2 b d), never above the street's.\"\"\"\n    if not (np.isfinite(info[\"radius\"]) and s0 < info[\"s_out\"]):\n        return v_street\n    vt = turn_speed(info, a_lat)\n    d = max(info[\"s_in\"] - s0, 0.0)\n    return float(min(v_street, np.sqrt(vt * vt + 2 * b * d)))\n\n\ndef predict_modes(scene, st, h=None, prior=None):\n    \"\"\"Map-aware prediction: one future per candidate lane, each with a probability.\n\n    Probability (Bayes, prior equal unless given): how well each mode explains what the\n    track shows now: its speed against the speed the mode expects here (SIG_V), its\n    heading (SIG_TH) and its offset from the lane's center (SIG_LAT).\"\"\"\n    h = horizons() if h is None else h\n    names = candidate_lanes(scene, st[\"p0\"], st[\"heading\"])\n    modes = []\n    for name in names:\n        ln, info = scene[\"lanes\"][name], scene[\"info\"][name]\n        s0, off = ln.project(st[\"p0\"])\n        s, a_exp = mode_plan(ln, info, s0, st[\"speed\"], h)\n        v_exp = expected_speed(info, s0)\n        dth = float(wrap(st[\"heading\"] - ln.heading_at(s0)))\n        like = dict(speed=float(gauss(st[\"speed\"] - v_exp, SIG_V)),\n                    heading=float(gauss(dth, SIG_TH)), offset=float(gauss(off, SIG_LAT)))\n        pr = 1.0 / len(names) if prior is None else prior.get(name, 0.0)\n        modes.append(dict(name=name, traj=ln.at(s), a_expected=a_exp, v_expected=v_exp, dheading=dth,\n                          offset=off, s0=s0, like=like, prior=pr,\n                          weight=pr * like[\"speed\"] * like[\"heading\"] * like[\"offset\"]))\n    total = sum(m[\"weight\"] for m in modes) or 1.0\n    for m in modes:\n        m[\"prob\"] = m[\"weight\"] / total\n    return sorted(modes, key=lambda m: -m[\"prob\"])\n\n\ndef predict_modes_with_av(scene, st, av_s, av_v, h=None):\n    \"\"\"predict_modes, plus the gap rule for a left turn across the AV's lane: if the AV\n    would reach the crossing less than GAP seconds after the car reaches its decision\n    point, the left-turn mode waits until the AV has passed the crossing. (Our\n    simulated driver waits 1 s longer: the predictor does not know that.)\"\"\"\n    h = horizons() if h is None else h\n    modes = predict_modes(scene, st, h)\n    cp = conflict_point(scene)\n    for m in modes:\n        if m[\"name\"] != \"west_to_south\":\n            continue\n        ln, info = scene[\"lanes\"][m[\"name\"]], scene[\"info\"][m[\"name\"]]\n        s0, _ = ln.project(st[\"p0\"])\n        s_plan, _ = mode_plan(ln, info, s0, st[\"speed\"], h)\n        t_reach = float(np.interp(info[\"s_in\"] - D_DECIDE, s_plan, h)) if s0 < info[\"s_in\"] - D_DECIDE else 0.0\n        t_av = (cp[\"s_b\"] - av_s) / av_v\n        m[\"gap\"] = t_av - t_reach\n        if m[\"gap\"] < GAP:\n            t_go = (cp[\"s_b\"] + CAR_LEN - av_s) / av_v\n            m[\"traj\"] = ln.at(wait_plan(ln, info, s0, st[\"speed\"], h, t_go))\n            m[\"waits\"] = True\n    return modes\n\n\ndef predict_follower(scene, lane_name, st, leader_traj, h=None, p=IDM):\n    \"\"\"A follower's future from the IDM, behind a leader whose future positions are\n    leader_traj (one per horizon step): the behavior model replaces constant speed.\"\"\"\n    h = horizons() if h is None else h\n    ln = scene[\"lanes\"][lane_name]\n    s0, _ = ln.project(st[\"p0\"])\n    t = np.r_[0.0, h]\n    lead = np.vstack([leader_traj[0] - (leader_traj[1] - leader_traj[0]), leader_traj])\n    d = follow(ln, s0, st[\"speed\"], t, lead, p)\n    return d[\"xy\"][1:], d[\"v\"][1:]\n\n\n# ----------------------------------------------------------------- scores\ndef ade(pred, truth):\n    return float(np.mean(np.hypot(*(pred - truth).T)))\n\n\ndef fde(pred, truth):\n    return float(np.hypot(*(pred[-1] - truth[-1])))\n\n\ndef errors_by_horizon(pred, truth):\n    return np.hypot(*(pred - truth).T)\n\n\ndef min_ade_fde(trajs, truth):\n    \"\"\"minADE and minFDE as Argoverse 2 defines them: both from the best mode, the one\n    whose end is closest to the truth. Returns (minADE, minFDE, index of that mode).\"\"\"\n    f = [fde(p, truth) for p in trajs]\n    best = int(np.argmin(f))\n    return ade(trajs[best], truth), f[best], best\n\n\n# ----------------------------------------------------------------- our test set\ndef test_set(scene=None, speeds=(6.0, 7.0, 8.0, 9.0, 10.0), seeds=(1, 2, 3, 4), every=0.5):\n    \"\"\"Many simulated drives through the junction, to measure the predictors on more\n    than one scene. Every move, five cruising speeds, four random seeds (all chosen).\n    Each drive: braking 0.8 to 2.0 m/s^2 and a turn taken at a sideways acceleration of\n    1.5 to 2.5 m/s^2 (drawn at random), and a speed that wanders by 0.3 m/s^2 (chosen).\n    A prediction starts every `every` seconds that has HIST of history and HORIZON of\n    future, while the car is between 50 m before the junction and its exit. Returns one\n    row per prediction.\"\"\"\n    scene = scene or load_scene()\n    rows = []\n    h = horizons()\n    for name, ln in scene[\"lanes\"].items():\n        info = scene[\"info\"][name]\n        for vc in speeds:\n            for seed in seeds:\n                rng = np.random.default_rng(1000 * seed + int(vc * 10) + zlib.crc32(name.encode()) % 997)\n                b = rng.uniform(0.8, 2.0)\n                alat = rng.uniform(1.5, 2.5)\n                vt = turn_speed(info, alat) if np.isfinite(info[\"radius\"]) else None\n                t_end = (ln.length - 5.0) / max(vc, 1.0) + 8.0\n                t = np.round(np.arange(0.0, t_end, DT), 6)\n                d = drive(ln, info, 2.0, vc, t, b=b, v_turn=vt, v_cruise=vc, rng=rng, wander=0.3)\n                ok = d[\"s\"] < ln.length - 1.0\n                track = d[\"xy\"] + NOISE * rng.standard_normal(d[\"xy\"].shape)\n                for now in np.arange(HIST, t[-1] - HORIZON, every):\n                    k = int(round(now / DT))\n                    if not (info[\"s_in\"] - 50.0 <= d[\"s\"][k] <= info[\"s_out\"]):\n                        continue\n                    fut = slice(k + 1, k + 1 + len(h))\n                    if not ok[fut].all() or len(t[fut]) < len(h):\n                        continue\n                    truth = d[\"xy\"][fut]\n                    st = fit_state(t[:k + 1], track[:k + 1], now=t[k])\n                    turn = abs(float(wrap(d[\"heading\"][fut][-1] - d[\"heading\"][k]))) > np.radians(20)\n                    preds = dict(cv=predict_cv(st, h), ctrv=predict_ctrv(st, h), ctra=predict_ctra(st, h))\n                    modes = predict_modes(scene, st, h)\n                    if modes:\n                        preds[\"map_top\"] = modes[0][\"traj\"]\n                    row = dict(move=name, speed=vc, seed=seed, now=float(t[k]), turn=turn,\n                               err={n: errors_by_horizon(p, truth) for n, p in preds.items()})\n                    if modes:\n                        mi = min_ade_fde([m[\"traj\"] for m in modes], truth)\n                        row.update(min_ade=mi[0], min_fde=mi[1], n_modes=len(modes),\n                                   p_true=float(sum(m[\"prob\"] for m in modes if m[\"name\"] == name)),\n                                   mode_probs=[(m[\"name\"] == name, float(m[\"prob\"])) for m in modes])\n                    var = cv_cov(st, h)\n                    e = preds[\"cv\"] - truth\n                    row[\"cv_inside95\"] = (np.sum(e ** 2, axis=1) / var) <= 5.991\n                    rows.append(row)\n    return rows\n", "handson": "\"\"\"L8 hands-on: where will the others be? Four parts on one Town01 junction.\n\n  python3 l8_handson.py --part scene      # the junction, the AV, car A and car B over time\n  python3 l8_handson.py --part physics    # CV, CTRV and CTRA for car A, from any \"now\"\n  python3 l8_handson.py --part modes      # map-aware prediction: two futures, their probabilities\n  python3 l8_handson.py --part interact   # car B behind A (IDM), and A's gap to the AV\n\nDrag the \"now\" slider to predict from another moment. Add --now T to open at T seconds,\n--snapshot out.png to save a still instead of opening a window, or --html out.html to\nsave an animation over \"now\". Needs numpy and matplotlib only (no CARLA, no ROS).\n\"\"\"\nimport argparse\nimport sys\nfrom pathlib import Path\n\nimport matplotlib\nimport numpy as np\n\nimport l8sim as m\nimport vehicle_icons as vi\n\nHERE = Path(__file__).resolve().parent\nCV, CTRV, CTRA, MAP, TRUTH = \"#2D6CA2\", \"#7B4FA0\", \"#9A6A00\", \"#1E9E74\", \"#1E2939\"\nCOLORS = {\"AV\": \"#1E2939\", \"A\": \"#D9694A\", \"B\": \"#8C8C8C\"}\n\n\n# ----------------------------------------------------------------- drawing\ndef draw_road(ax, sc):\n    for e in sc[\"edges\"]:\n        poly = np.r_[e[:, :2], e[::-1, 2:]]\n        ax.fill(poly[:, 0], poly[:, 1], fc=\"#E4E6E9\", ec=\"#E4E6E9\", lw=1.0, zorder=0)\n    for e, junc in zip(sc[\"edges\"], sc[\"edge_in_junction\"]):\n        if not junc:\n            ax.plot(e[:, 0], e[:, 1], color=\"white\", lw=1.2, ls=(0, (4, 4)), zorder=1)\n            ax.plot(e[:, 2], e[:, 3], color=\"#9AA1A9\", lw=0.8, zorder=1)\n    ax.set_aspect(\"equal\")\n    ax.set_xlabel(\"x east (m)\")\n    ax.set_ylabel(\"y north (m)\")\n\n\nclass Car:\n    \"\"\"A vehicle icon (icons/: the AV, car A, car B), sharp at any zoom, with its name above.\"\"\"\n    def __init__(self, ax, name):\n        self.icon = vi.Vehicle(ax, name, color=COLORS[name], zorder=8)\n        self.label = ax.text(0, 0, name, fontsize=10, ha=\"center\", va=\"bottom\", zorder=9)\n\n    def set(self, xy, heading):\n        self.icon.set(xy, heading)\n        self.label.set_position((xy[0], xy[1] + 2.2))\n\n\ndef state_at(o, name, now):\n    k = int(np.argmin(abs(o[\"t\"] - now)))\n    return o[name][\"xy\"][k], o[name][\"heading\"][k], k\n\n\ndef fit_at(o, name, now):\n    k = int(np.argmin(abs(o[\"t\"] - now)))\n    return m.fit_state(o[\"t\"][:k + 1], o[name][\"track\"][:k + 1], now=o[\"t\"][k]), k\n\n\ndef future(o, name, k, n):\n    return o[name][\"xy\"][k + 1:k + 1 + n]\n\n\n# ----------------------------------------------------------------- the parts\ndef part_scene(fig, sc, o, now):\n    ax = fig.add_subplot(111)\n    draw_road(ax, sc)\n    ax.set_xlim(98, 214)\n    ax.set_ylim(-26, 12)\n    cp = m.conflict_point(sc)[\"xy\"]\n    ax.plot(*cp, \"x\", color=\"#C0392B\", ms=10, mew=2.5, zorder=7)\n    ax.annotate(\"crossing\", cp, xytext=(10, -14), textcoords=\"offset points\", color=\"#C0392B\")\n    cars = {n: Car(ax, n) for n in (\"AV\", \"A\", \"B\")}\n    trails = {n: ax.plot([], [], \".\", color=COLORS[n], ms=3, zorder=6)[0] for n in (\"A\", \"B\")}\n    title = ax.set_title(\"\")\n\n    def update(now):\n        for n, car in cars.items():\n            xy, hd, k = state_at(o, n, now)\n            car.set(xy, hd)\n            if n in trails:\n                past = o[\"t\"] <= now + 1e-9\n                trails[n].set_data(o[n][\"track\"][past, 0], o[n][\"track\"][past, 1])\n        title.set_text(f\"t = {now:+.1f} s   (dots: the tracked positions the AV sees)\")\n    return update\n\n\ndef part_physics(fig, sc, o, now):\n    ax = fig.add_subplot(121)\n    draw_road(ax, sc)\n    ax.set_xlim(132, 190)\n    ax.set_ylim(-30, 10)\n    ax2 = fig.add_subplot(122)\n    h = m.horizons()\n    lines = {n: ax.plot([], [], color=c, lw=2, ls=ls, label=n)[0]\n             for n, c, ls in ((\"truth\", TRUTH, \"-\"), (\"CV\", CV, \"-\"), (\"CTRV\", CTRV, \"--\"), (\"CTRA\", CTRA, \"-.\"))}\n    errs = {n: ax2.plot([], [], color=c, lw=2, ls=ls, label=n)[0]\n            for n, c, ls in ((\"CV\", CV, \"-\"), (\"CTRV\", CTRV, \"--\"), (\"CTRA\", CTRA, \"-.\"))}\n    car = Car(ax, \"A\")\n    ax.legend(loc=\"lower right\", fontsize=9)\n    ax2.set_xlabel(\"horizon (s)\")\n    ax2.set_ylabel(\"error (m)\")\n    ax2.set_xlim(0, m.HORIZON)\n    ax2.axhline(m.MISS, color=\"0.5\", lw=0.8, ls=\":\")\n    ax2.legend(loc=\"upper left\", fontsize=9)\n    title = ax.set_title(\"\")\n\n    def update(now):\n        st, k = fit_at(o, \"A\", now)\n        tr = future(o, \"A\", k, len(h))\n        hh = h[:len(tr)]\n        car.set(o[\"A\"][\"xy\"][k], o[\"A\"][\"heading\"][k])\n        lines[\"truth\"].set_data(tr[:, 0], tr[:, 1])\n        preds = {\"CV\": m.predict_cv(st, hh), \"CTRV\": m.predict_ctrv(st, hh), \"CTRA\": m.predict_ctra(st, hh)}\n        top = 1.0\n        for n, p in preds.items():\n            lines[n].set_data(p[:, 0], p[:, 1])\n            e = m.errors_by_horizon(p, tr)\n            errs[n].set_data(hh, e)\n            top = max(top, e.max())\n        ax2.set_ylim(0, top * 1.1)\n        ax2.set_title(\"FDE at 5 s: \" + \", \".join(f\"{n} {m.fde(p, tr):.1f} m\" for n, p in preds.items()), fontsize=10)\n        title.set_text(f\"car A from t = {now:+.1f} s: speed {st['speed']:.2f} m/s,\\n\"\n                       f\"yaw rate {st['omega']:+.3f} rad/s, speeding up by {st['a_along']:+.2f} m/s\u00b2\")\n        title.set_fontsize(10)\n    return update\n\n\ndef part_modes(fig, sc, o, now):\n    ax = fig.add_subplot(121)\n    draw_road(ax, sc)\n    ax.set_xlim(132, 190)\n    ax.set_ylim(-30, 10)\n    ax2 = fig.add_subplot(122)\n    h = m.horizons()\n    ts = np.round(np.arange(-1.5, 3.01, 0.1), 2)\n    ps = []\n    for tn in ts:\n        st, _ = fit_at(o, \"A\", tn)\n        ps.append(sum(md[\"prob\"] for md in m.predict_modes(sc, st) if md[\"name\"] == \"west_to_south\"))\n    ax2.plot(ts, ps, color=MAP, lw=2)\n    mark = ax2.axvline(now, color=\"0.4\", ls=\":\")\n    ax2.set_ylim(0, 1.05)\n    ax2.set_xlabel(\"time (s)\")\n    ax2.set_ylabel(\"P(left turn)\")\n    truth, = ax.plot([], [], color=TRUTH, lw=2, label=\"truth\", zorder=7)\n    mode_lines = [ax.plot([], [], color=MAP, lw=2, ls=ls)[0] for ls in (\"-\", \"--\", \":\")]\n    car = Car(ax, \"A\")\n    title = ax.set_title(\"\")\n    ax.legend(loc=\"lower right\", fontsize=9)\n\n    def update(now):\n        st, k = fit_at(o, \"A\", now)\n        tr = future(o, \"A\", k, len(h))\n        hh = h[:len(tr)]\n        car.set(o[\"A\"][\"xy\"][k], o[\"A\"][\"heading\"][k])\n        truth.set_data(tr[:, 0], tr[:, 1])\n        modes = m.predict_modes(sc, st, hh)\n        text = []\n        for i, line in enumerate(mode_lines):\n            if i < len(modes):\n                p = modes[i][\"traj\"]\n                line.set_data(p[:, 0], p[:, 1])\n                line.set_linewidth(1 + 4 * modes[i][\"prob\"])\n                text.append(f\"{m.MOVES[modes[i]['name']]}: p = {modes[i]['prob']:.2f}, FDE {m.fde(p, tr):.1f} m\")\n            else:\n                line.set_data([], [])\n        mark.set_xdata([now, now])\n        title.set_text(f\"t = {now:+.1f} s\\n\" + \"\\n\".join(text))\n        title.set_fontsize(9)\n    return update\n\n\ndef part_interact(fig, sc, o, now, o2=None):\n    from matplotlib.widgets import CheckButtons\n    runs = {\"run 1\": o, \"run 2\": o2 if o2 is not None else m.our_scene(sc, av_closer=24.0)}\n    ax = fig.add_subplot(121)\n    ax2 = fig.add_subplot(122)\n    h = m.horizons()\n    lav = sc[\"lanes\"][\"east_to_east\"]\n    la = sc[\"lanes\"][\"west_to_south\"]\n    state = {\"run\": \"run 1\"}\n    check_ax = fig.add_axes([0.01, 0.02, 0.16, 0.08])\n    check = CheckButtons(check_ax, [\"AV 24 m closer\"], [False])\n    fig._l8_check = check\n\n    def update(now):\n        oo = runs[state[\"run\"]]\n        ax.clear()\n        ax2.clear()\n        stA, k = fit_at(oo, \"A\", now)\n        stB, _ = fit_at(oo, \"B\", now)\n        trA, trB = future(oo, \"A\", k, len(h)), future(oo, \"B\", k, len(h))\n        hh = h[:len(trA)]\n        av_s = lav.project(oo[\"AV\"][\"xy\"][k])[0]\n        plain = m.predict_modes(sc, stA, hh)\n        gap = m.predict_modes_with_av(sc, stA, av_s, m.V_CRUISE, hh)\n        s0 = la.project(stA[\"p0\"])[0]\n        along = lambda xy: np.array([la.project(p)[0] for p in xy]) - s0\n        ax.plot(hh, along(trA), color=TRUTH, lw=2, label=\"truth\")\n        for md, ls, lab in ((plain[0], \"--\", \"most likely mode, AV ignored\"),\n                            (gap[0], \"-\", \"most likely mode, with the gap rule\")):\n            ax.plot(hh, along(md[\"traj\"]), color=MAP, lw=2, ls=ls, label=lab)\n        g = next((md.get(\"gap\") for md in gap if \"gap\" in md), None)\n        ax.set_title(f\"{state['run']}, car A from t = {now:+.1f} s\" +\n                     (f\": gap to the AV {g:.1f} s (A turns if it is at least {m.GAP} s)\" if g is not None else \"\"),\n                     fontsize=10)\n        ax.set_xlabel(\"horizon (s)\")\n        ax.set_ylabel(\"car A: meters driven\")\n        ax.legend(fontsize=9, loc=\"upper left\")\n        pB, vB = m.predict_follower(sc, \"west_to_west\", stB, gap[0][\"traj\"], hh)\n        ax2.plot(hh, oo[\"B\"][\"v\"][k + 1:k + 1 + len(hh)], color=TRUTH, lw=2, label=\"truth\")\n        ax2.plot(hh, np.full_like(hh, stB[\"speed\"]), color=CV, lw=2, label=\"CV\")\n        ax2.plot(hh, vB, color=MAP, lw=2, ls=\"--\", label=\"IDM behind A's likely future\")\n        ax2.set_title(f\"car B: FDE CV {m.fde(m.predict_cv(stB, hh), trB):.1f} m, IDM {m.fde(pB, trB):.1f} m\",\n                      fontsize=10)\n        ax2.set_xlabel(\"horizon (s)\")\n        ax2.set_ylabel(\"car B's speed (m/s)\")\n        ax2.legend(fontsize=9, loc=\"lower left\")\n        fig.canvas.draw_idle()\n\n    def toggle(_label):\n        state[\"run\"] = \"run 2\" if check.get_status()[0] else \"run 1\"\n        update(fig._l8_now())\n    check.on_clicked(toggle)\n    return update\n\n\nPARTS = {\"scene\": part_scene, \"physics\": part_physics, \"modes\": part_modes, \"interact\": part_interact}\n\n\ndef main(argv=None):\n    ap = argparse.ArgumentParser(description=__doc__, formatter_class=argparse.RawDescriptionHelpFormatter)\n    ap.add_argument(\"--part\", choices=PARTS, required=True)\n    ap.add_argument(\"--now\", type=float, default=0.0, help=\"the moment to predict from (s), -0.5 to 3\")\n    ap.add_argument(\"--snapshot\", help=\"save a still to this PNG instead of opening a window\")\n    ap.add_argument(\"--html\", help=\"save an animation over 'now' to this HTML file\")\n    a = ap.parse_args(argv)\n    if a.snapshot or a.html:\n        matplotlib.use(\"Agg\")\n    import matplotlib.pyplot as plt\n    from matplotlib.widgets import Slider\n    sc = m.load_scene()\n    o = m.our_scene(sc)\n    fig = plt.figure(figsize=(13, 6.5))\n    update = PARTS[a.part](fig, sc, o, a.now)\n    fig.subplots_adjust(bottom=0.2, top=0.86, wspace=0.25)\n    s_ax = fig.add_axes([0.25, 0.05, 0.5, 0.03])\n    lo = -0.5 if a.part != \"scene\" else -2.0\n    slider = Slider(s_ax, \"now (s)\", lo, 3.0, valinit=float(np.clip(a.now, lo, 3.0)), valstep=0.1)\n    fig._l8_now = lambda: slider.val\n    slider.on_changed(update)\n    update(slider.val)\n    if a.snapshot:\n        fig.savefig(a.snapshot, dpi=110)\n        print(\"wrote\", a.snapshot)\n    elif a.html:\n        from matplotlib.animation import FuncAnimation\n        frames = np.round(np.arange(lo, 3.01, 0.2), 2)\n        anim = FuncAnimation(fig, lambda f: update(f), frames=frames, interval=200)\n        Path(a.html).write_text(anim.to_jshtml())\n        print(\"wrote\", a.html)\n    else:\n        plt.show()\n\n\nif __name__ == \"__main__\":\n    main(sys.argv[1:])\n", "icons_py": "\"\"\"Vehicle icons as vector shapes for matplotlib: sharp at any zoom, in a window or a saved file.\n\n    import vehicle_icons as vi\n    av = vi.Vehicle(ax, \"AV\", color=\"#1E2939\")      # icons/top_car.svg, the course's AV\n    av.set((x, y), heading)                         # heading in rad, 0 = east\n\nEach icon is read from its SVG file (one or more paths, commands M L H V C S Z) and drawn as\na PathPatch. A car's position is its base link: the middle of the rear axle, 0.9 m in from\nthe rear bumper of the 4.5 m car (the course's convention). Needs numpy and matplotlib only.\n\nIcons (icons/ next to this file): top_car.svg (the AV), noun_sedancar_6913727.svg (car A) and\nnoun_sedancar_6913728.svg (car B), by Stone from the Noun Project (thenounproject.com).\n\"\"\"\nimport re\nfrom pathlib import Path as _P\n\nimport numpy as np\nfrom matplotlib.patches import PathPatch\nfrom matplotlib.path import Path\nfrom matplotlib.transforms import Affine2D\n\nHERE = _P(__file__).resolve().parent\nICONS = {\"AV\": \"top_car.svg\", \"A\": \"noun_sedancar_6913727.svg\", \"B\": \"noun_sedancar_6913728.svg\"}\nCAR_LEN, REAR = 4.5, 0.9\n_TOKEN = re.compile(r\"[MmLlHhVvCcSsZz]|[-+]?(?:\\d+\\.?\\d*|\\.\\d+)(?:[eE][-+]?\\d+)?\")\n\n\ndef _subpaths(d):\n    \"\"\"One SVG path string to a list of closed subpaths, each (vertices, codes), y up.\"\"\"\n    toks = _TOKEN.findall(d)\n    i, cmd = 0, None\n    cur, start, last_ctrl = np.zeros(2), np.zeros(2), None\n    subs, verts, codes = [], [], []\n\n    def num():\n        nonlocal i\n        i += 1\n        return float(toks[i - 1])\n\n    def finish():\n        if verts:\n            subs.append((np.array(verts), np.array(codes, dtype=np.uint8)))\n\n    while i < len(toks):\n        if toks[i].isalpha():\n            cmd = toks[i]\n            i += 1\n            if cmd in \"Zz\":\n                if verts:\n                    verts.append(start.copy()); codes.append(Path.CLOSEPOLY)\n                    finish(); verts, codes = [], []\n                cur, last_ctrl = start.copy(), None\n                continue\n        rel = cmd.islower()\n        c = cmd.upper()\n        base = cur if rel else np.zeros(2)\n        if c == \"M\":\n            finish(); verts, codes = [], []\n            cur = base + (num(), num())\n            start = cur.copy()\n            verts.append(cur.copy()); codes.append(Path.MOVETO)\n            cmd = \"l\" if rel else \"L\"          # later pairs are line-tos\n            last_ctrl = None\n        elif c == \"L\":\n            cur = base + (num(), num())\n            verts.append(cur.copy()); codes.append(Path.LINETO); last_ctrl = None\n        elif c == \"H\":\n            cur = np.array([(cur[0] if rel else 0) + num(), cur[1]])\n            verts.append(cur.copy()); codes.append(Path.LINETO); last_ctrl = None\n        elif c == \"V\":\n            cur = np.array([cur[0], (cur[1] if rel else 0) + num()])\n            verts.append(cur.copy()); codes.append(Path.LINETO); last_ctrl = None\n        elif c in \"CS\":\n            if c == \"C\":\n                c1 = base + (num(), num())\n            else:\n                c1 = 2 * cur - last_ctrl if last_ctrl is not None else cur.copy()\n            c2 = base + (num(), num())\n            end = base + (num(), num())\n            verts += [c1, c2, end]; codes += [Path.CURVE4] * 3\n            cur, last_ctrl = end, c2\n        else:\n            raise ValueError(f\"unsupported SVG path command {cmd!r}\")\n    finish()\n    return [(v * (1, -1), cd) for v, cd in subs]          # SVG y points down\n\n\ndef _area(v):\n    x, y = v[:, 0], v[:, 1]\n    return 0.5 * np.sum(x * np.roll(y, -1) - np.roll(x, -1) * y)\n\n\ndef _inside(pt, v):\n    return Path(v).contains_point(pt)\n\n\ndef load_icon(svg):\n    \"\"\"The icon's outline as one Path, front up (+y), its bounding box from x -w/2 to w/2 and\n    y 0 (rear) to 1 (front): the length is 1. Holes (windows) are wound against their\n    outline, so matplotlib's nonzero fill leaves them empty, as the SVG's even-odd rule does.\"\"\"\n    text = _P(svg).read_text()\n    subs = [s for d in re.findall(r'\\sd=\"([^\"]*)\"', text) for s in _subpaths(d)]\n    allv = np.vstack([v for v, _ in subs])\n    lo, hi = allv.min(0), allv.max(0)\n    scale = 1.0 / (hi[1] - lo[1])\n    cx = 0.5 * (lo[0] + hi[0])\n    out_v, out_c = [], []\n    for k, (v, cd) in enumerate(subs):\n        depth = sum(_inside(v[0], w) for j, (w, _) in enumerate(subs) if j != k)\n        want_ccw = depth % 2 == 0                        # outlines CCW, holes CW\n        if (_area(v) > 0) != want_ccw:\n            v, cd = _reverse(v, cd)\n        out_v.append((v - (cx, lo[1])) * scale); out_c.append(cd)\n    return Path(np.vstack(out_v), np.concatenate(out_c))\n\n\ndef _reverse(v, cd):\n    \"\"\"The same closed subpath, traversed the other way (Bezier segments kept).\"\"\"\n    segs, i = [], 1                                       # v[0] is the MOVETO\n    while i < len(cd):\n        n = 3 if cd[i] == Path.CURVE4 else 1\n        segs.append((v[i - 1], v[i:i + n], cd[i]))\n        i += n\n    nv, nc = [segs[-1][1][-1]], [Path.MOVETO]\n    for p0, pts, code in reversed(segs):\n        if code == Path.CURVE4:\n            nv += [pts[1], pts[0], p0]; nc += [Path.CURVE4] * 3\n        else:\n            nv.append(p0); nc.append(Path.LINETO if code != Path.CLOSEPOLY else Path.LINETO)\n    nv.append(nv[0]); nc.append(Path.CLOSEPOLY)\n    return np.array(nv), np.array(nc, dtype=np.uint8)\n\n\n_CACHE = {}\n\n\ndef icon(name, folder=HERE / \"icons\"):\n    \"\"\"The Path of a vehicle: \"AV\", \"A\", \"B\", or an SVG file name in `folder`.\"\"\"\n    key = (str(folder), name)\n    if key not in _CACHE:\n        _CACHE[key] = load_icon(_P(folder) / ICONS.get(name, name))\n    return _CACHE[key]\n\n\nclass Vehicle:\n    \"\"\"One vehicle icon on `ax`, moved with set(xy, heading).\"\"\"\n\n    def __init__(self, ax, name, color=\"black\", alpha=1.0, length=CAR_LEN, rear=REAR, zorder=8,\n                 folder=HERE / \"icons\"):\n        self.ax, self.length, self.rear = ax, length, rear\n        self.patch = PathPatch(icon(name, folder), facecolor=color, edgecolor=\"none\", alpha=alpha,\n                               zorder=zorder)\n        ax.add_patch(self.patch)\n\n    def set(self, xy, heading):\n        \"\"\"xy: the base link (m); heading: rad, 0 = east, counterclockwise.\"\"\"\n        L = self.length\n        tr = (Affine2D().translate(0, -self.rear / L).scale(L)\n              .rotate(heading - np.pi / 2).translate(*xy))\n        self.patch.set_transform(tr + self.ax.transData)\n        return self.patch\n\n\ndef draw(ax, name, xy, heading, **kw):\n    \"\"\"Draw one vehicle once (for still figures).\"\"\"\n    v = Vehicle(ax, name, **kw)\n    v.set(xy, heading)\n    return v.patch\n\n\ndef draw_side(ax, svg, x_front, length=CAR_LEN, color=\"black\", alpha=1.0, zorder=5):\n    \"\"\"A side-view icon (front to the right in the SVG) with its front bumper at x_front and\n    its wheels on y = 0. Returns its height (m).\"\"\"\n    # A side icon's length runs along the SVG's x and its height along y.\n    raw = [s for d in re.findall(r'\\sd=\"([^\"]*)\"', _P(svg).read_text()) for s in _subpaths(d)]\n    allv = np.vstack([s[0] for s in raw])\n    lo, hi = allv.min(0), allv.max(0)\n    sc = length / (hi[0] - lo[0])\n    verts, codes = [], []\n    for k, (sv, cd) in enumerate(raw):\n        depth = sum(_inside(sv[0], w2) for j, (w2, _) in enumerate(raw) if j != k)\n        if (_area(sv) > 0) != (depth % 2 == 0):\n            sv, cd = _reverse(sv, cd)\n        verts.append((sv - (hi[0], lo[1])) * sc + (x_front, 0)); codes.append(cd)\n    path = Path(np.vstack(verts), np.concatenate(codes))\n    ax.add_patch(PathPatch(path, facecolor=color, edgecolor=\"none\", alpha=alpha, zorder=zorder))\n    return (hi[1] - lo[1]) * sc\n", "icons": {"noun_sedancar_6913727.svg": "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\n<svg\n   version=\"1.1\"\n   viewBox=\"-5.0 -10.0 110.0 135.0\"\n   id=\"svg2\"\n   sodipodi:docname=\"noun_sedancar_6913727.svg\"\n   inkscape:version=\"1.4.4 (1:1.4.4+202605061436+dcaf3e7d9e)\"\n   xmlns:inkscape=\"http://www.inkscape.org/namespaces/inkscape\"\n   xmlns:sodipodi=\"http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd\ AAAAAAAAAAACAAVCyAABsYW5lX2luX2p1bmN0aW9uLm5weVBLAQItAy0AAAAIAAAAIQA2liGoVgAAAKAAAAAKAAAAAAAAAAAAAACAAeCyAAB3aW5kb3cubnB5UEsBAi0DLQAAAAgAAAAhAPmfZS5RAAAAkAAAABMAAAAAAAAAAAAAAIABcrMAAGp1bmN0aW9uX2NlbnRlci5ucHlQSwECLQMtAAAACAAAACEA5lSYe6oAAABoAQAACgAAAAAAAAAAAAAAgAEItAAAc291cmNlLm5weVBLBQYAAAAANwA3ADUNAADutAAAAAA=";
const GLUE = "\nimport sys, io, base64, importlib\nsys.path.insert(0, \"/home/pyodide\")\nimport matplotlib\nmatplotlib.use(\"Agg\")\nimport matplotlib.pyplot as plt\nimport l8sim\nimport l8_handson as H\n_cache = {}\n\ndef _setup():\n    if \"o\" not in _cache:\n        sc = l8sim.load_scene()\n        _cache.update(sc=sc, o=l8sim.our_scene(sc), o2=l8sim.our_scene(sc, av_closer=24.0))\n\ndef render(part, now, closer=False):\n    _setup()\n    if part not in _cache:\n        fig = plt.figure(figsize=(13, 6.5))\n        extra = {\"o2\": _cache[\"o2\"]} if part == \"interact\" else {}\n        upd = H.PARTS[part](fig, _cache[\"sc\"], _cache[\"o\"], now, **extra)\n        fig.subplots_adjust(bottom=0.1, top=0.86, wspace=0.25)\n        _cache[part] = (fig, upd)\n    fig, upd = _cache[part]\n    fig._l8_now = lambda: now\n    if part == \"interact\":\n        check = fig._l8_check\n        check.ax.set_visible(False)          # the page's own checkbox replaces it\n        if check.get_status()[0] != bool(closer):\n            check.set_active(0)              # runs the script's toggle, which redraws\n        for artist in check.ax.get_children():\n            artist.set_visible(False)        # its tick mark too\n    upd(now)\n    buf = io.BytesIO()\n    fig.savefig(buf, format=\"png\", dpi=80)\n    return base64.b64encode(buf.getvalue()).decode()\n\ndef reload_sim(src):\n    with open(\"/home/pyodide/l8sim.py\", \"w\") as f:\n        f.write(src)\n    importlib.reload(l8sim)\n    importlib.reload(H)\n    for k in list(_cache):\n        if k in H.PARTS:\n            plt.close(_cache[k][0])\n        del _cache[k]\n";
let py = null, busy = false, pending = null;
const status = document.getElementById("status");

function el(tag, attrs = {}, html = "") {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (html) e.innerHTML = html;
  return e;
}

function buildTabs() {
  const tabs = document.getElementById("tabs"), panels = document.getElementById("panels");
  const all = PARTS.map(p => ({id: p[0], label: p[1]})).concat([{id: "code", label: "l8sim.py"}]);
  all.forEach((t, i) => {
    const b = el("button", {role: "tab", id: "tab-" + t.id, "aria-controls": "panel-" + t.id,
                            "aria-selected": i === 0 ? "true" : "false"}, t.label);
    b.onclick = () => select(t.id);
    tabs.appendChild(b);
  });
  for (const [id, label, lo, qs] of PARTS) {
    const p = el("section", {class: "panel", id: "panel-" + id, role: "tabpanel", "aria-labelledby": "tab-" + id});
    p.appendChild(el("ol", {}, qs.map(q => "<li>" + q + "</li>").join("")));
    const c = el("div", {class: "controls"});
    const lab = el("label", {}, "now: <output id='v-" + id + "'>0.0</output> s ");
    const r = el("input", {type: "range", id: "now-" + id, min: lo, max: 3, step: 0.1, value: 0});
    lab.appendChild(r); c.appendChild(lab);
    if (id === "interact") {
      const cl = el("label", {}, " AV 24 m closer (run 2)");
      const cb = el("input", {type: "checkbox", id: "closer"});
      cl.prepend(cb); c.appendChild(cl);
      cb.onchange = () => draw(id);
    }
    r.oninput = () => { document.getElementById("v-" + id).textContent = Number(r.value).toFixed(1); draw(id); };
    p.appendChild(c);
    p.appendChild(el("img", {class: "plot", id: "img-" + id, alt: label + ": the plot for the chosen now"}));
    p.appendChild(el("pre", {class: "err", id: "err-" + id}));
    p.hidden = id !== PARTS[0][0];
    panels.appendChild(p);
  }
  const p = el("section", {class: "panel", id: "panel-code", role: "tabpanel", "aria-labelledby": "tab-code"});
  p.hidden = true;
  p.appendChild(el("p", {}, "Edit <code>l8sim.py</code> (for example <code>SIG_V</code>, <code>A_LAT</code> or " +
                            "<code>GAP</code>), then press <b>Apply</b>: every tab reruns with your version."));
  const ta = el("textarea", {id: "src", spellcheck: "false", "aria-label": "l8sim.py source"});
  ta.value = SRC.l8sim;
  p.appendChild(ta);
  const c = el("div", {class: "controls"});
  const apply = el("button", {class: "act"}, "Apply");
  const reset = el("button", {class: "act secondary"}, "Reset to the original");
  apply.onclick = () => applySrc(ta.value);
  reset.onclick = () => { ta.value = SRC.l8sim; applySrc(ta.value); };
  c.appendChild(apply); c.appendChild(reset);
  p.appendChild(c);
  p.appendChild(el("pre", {class: "err", id: "err-code"}));
  panels.appendChild(p);
}

function select(id) {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.id === "tab-" + id));
  document.querySelectorAll(".panel").forEach(p => p.hidden = p.id !== "panel-" + id);
  if (id !== "code" && !document.getElementById("img-" + id).src) draw(id);
}

async function draw(id) {
  if (!py) return;
  if (busy) { pending = id; return; }
  busy = true;
  const now = Number(document.getElementById("now-" + id).value);
  const closer = id === "interact" && document.getElementById("closer").checked;
  const err = document.getElementById("err-" + id);
  try {
    const b64 = py.globals.get("render")(id, now, closer);
    document.getElementById("img-" + id).src = "data:image/png;base64," + b64;
    err.textContent = "";
  } catch (e) { err.textContent = String(e); }
  busy = false;
  if (pending) { const p = pending; pending = null; draw(p); }
}

async function applySrc(src) {
  const err = document.getElementById("err-code");
  status.textContent = "Running your l8sim.py...";
  try {
    py.globals.get("reload_sim")(src);
    err.textContent = "";
    for (const [id] of PARTS) document.getElementById("img-" + id).removeAttribute("src");
    status.textContent = "Your l8sim.py is in use. Open a part's tab to see it.";
  } catch (e) { err.textContent = String(e); status.textContent = "l8sim.py has an error (see below)."; }
}

async function main() {
  buildTabs();
  try {
    py = await loadPyodide();
    status.textContent = "Loading numpy and matplotlib...";
    await py.loadPackage(["numpy", "matplotlib"]);
    py.FS.writeFile("/home/pyodide/l8sim.py", SRC.l8sim);
    py.FS.writeFile("/home/pyodide/l8_handson.py", SRC.handson);
    py.FS.writeFile("/home/pyodide/vehicle_icons.py", SRC.icons_py);
    py.FS.mkdir("/home/pyodide/icons");
    for (const [name, text] of Object.entries(SRC.icons)) py.FS.writeFile("/home/pyodide/icons/" + name, text);
    py.FS.writeFile("/home/pyodide/l8_scene.npz", Uint8Array.from(atob(NPZ_B64), c => c.charCodeAt(0)));
    status.textContent = "Simulating the scene...";
    await py.runPythonAsync(GLUE);
    status.textContent = "Ready. Drag a slider; each part redraws for that moment.";
    draw(PARTS[0][0]);
  } catch (e) {
    status.textContent = "Python could not start: " + e;
  }
}
main();
</script>
