<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d">
  <title id="t">The GP5 model</title>
  <desc id="d">Three inputs on the left: the front camera image, the text command and the speed. The image goes to the CLIP image encoder and the command to the CLIP text encoder, both frozen. Each encoder gives 512 numbers; the speed is 1 number. The three are joined into one input of 1,025 numbers, which goes to the action decoder, a small MLP that you train. The decoder fills a VehicleCmd: steer from -1 to 1, throttle from 0 to 0.75 and brake from 0 to 1.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#424242"/>
    </marker>
    <clipPath id="thumb"><rect x="35" y="34" width="160" height="70" rx="6"/></clipPath>
  </defs>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #212121; }
    .h { font-size: 22px; font-weight: 700; }
    .b { font-size: 21px; }
    .s { font-size: 19px; fill: #424242; }
    .m { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 17px; fill: #37474f; }
    .badge { font-size: 16px; font-weight: 700; letter-spacing: 0.4px; fill: #ffffff; }
    .line { stroke: #424242; stroke-width: 2.6; fill: none; }
  </style>

  <rect width="900" height="500" fill="#ffffff"/>

  <!-- Inputs -->
  <rect x="15" y="20" width="200" height="145" rx="12" fill="#fafafa" stroke="#616161" stroke-width="2"/>
  <g clip-path="url(#thumb)">
    <rect x="35" y="34" width="160" height="70" fill="#cfe8fc"/>
    <rect x="35" y="72" width="160" height="32" fill="#a5d6a7"/>
    <path d="M87,104 L109,72 L121,72 L143,104 Z" fill="#78909c"/>
    <path d="M115,100 L115,94 M115,88 L115,83 M115,79 L115,75" stroke="#ffffff" stroke-width="2.2"/>
    <rect x="148" y="58" width="6" height="16" fill="#8d6e63"/>
    <circle cx="151" cy="54" r="9" fill="#66bb6a"/>
  </g>
  <rect x="35" y="34" width="160" height="70" rx="6" fill="none" stroke="#9e9e9e" stroke-width="1.2"/>
  <text class="b" x="115" y="140" text-anchor="middle">front camera</text>

  <rect x="15" y="190" width="200" height="115" rx="12" fill="#fafafa" stroke="#616161" stroke-width="2"/>
  <text class="b" x="115" y="223" text-anchor="middle">text command</text>
  <text class="m" x="115" y="254" text-anchor="middle">"turn left at the</text>
  <text class="m" x="115" y="277" text-anchor="middle">intersection"</text>

  <rect x="15" y="330" width="200" height="80" rx="12" fill="#fafafa" stroke="#616161" stroke-width="2"/>
  <text class="b" x="115" y="364" text-anchor="middle">speed</text>
  <text class="s" x="115" y="392" text-anchor="middle">in m/s</text>

  <!-- Frozen encoders -->
  <rect x="275" y="30" width="180" height="125" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.6"/>
  <text class="h" x="365" y="68" text-anchor="middle">CLIP</text>
  <text class="h" x="365" y="96" text-anchor="middle">image encoder</text>
  <rect x="315" y="111" width="100" height="28" rx="14" fill="#1565c0"/>
  <path d="M330,122 v-3.5 a5,5 0 0 1 10,0 v3.5" fill="none" stroke="#ffffff" stroke-width="2"/>
  <rect x="327" y="122" width="16" height="11" rx="2" fill="#ffffff"/>
  <text class="badge" x="350" y="131">frozen</text>

  <rect x="275" y="185" width="180" height="125" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.6"/>
  <text class="h" x="365" y="223" text-anchor="middle">CLIP</text>
  <text class="h" x="365" y="251" text-anchor="middle">text encoder</text>
  <rect x="315" y="266" width="100" height="28" rx="14" fill="#1565c0"/>
  <path d="M330,277 v-3.5 a5,5 0 0 1 10,0 v3.5" fill="none" stroke="#ffffff" stroke-width="2"/>
  <rect x="327" y="277" width="16" height="11" rx="2" fill="#ffffff"/>
  <text class="badge" x="350" y="286">frozen</text>

  <!-- Arrows: inputs to encoders, encoders and speed to the joined input -->
  <path class="line" d="M215,92 H273" marker-end="url(#ah)"/>
  <path class="line" d="M215,247 H273" marker-end="url(#ah)"/>
  <path class="line" d="M455,92 H583" marker-end="url(#ah)"/>
  <path class="line" d="M455,247 H583" marker-end="url(#ah)"/>
  <path class="line" d="M215,370 H583" marker-end="url(#ah)"/>
  <text class="s" x="519" y="80" text-anchor="middle">512 numbers</text>
  <text class="s" x="519" y="235" text-anchor="middle">512 numbers</text>
  <text class="s" x="519" y="358" text-anchor="middle">1 number</text>

  <!-- The joined input vector -->
  <rect x="585" y="25" width="50" height="375" rx="10" fill="none" stroke="#424242" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="595" y="40" width="30" height="105" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
  <rect x="595" y="195" width="30" height="105" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
  <rect x="595" y="358" width="30" height="24" rx="4" fill="#eeeeee" stroke="#616161" stroke-width="2"/>
  <text class="b" x="610" y="428" text-anchor="middle">joined:</text>
  <text class="b" x="610" y="452" text-anchor="middle">1,025</text>
  <text class="b" x="610" y="476" text-anchor="middle">numbers</text>

  <!-- Trained decoder -->
  <path class="line" d="M635,220 H668" marker-end="url(#ah)"/>
  <rect x="670" y="150" width="215" height="140" rx="12" fill="#fff3e0" stroke="#e65100" stroke-width="2.6"/>
  <text class="h" x="777.5" y="190" text-anchor="middle">action decoder</text>
  <text class="b" x="777.5" y="220" text-anchor="middle">small MLP</text>
  <rect x="725" y="238" width="105" height="28" rx="14" fill="#e65100"/>
  <text class="badge" x="777.5" y="258" text-anchor="middle">trained</text>

  <!-- Output command, under the decoder -->
  <path class="line" d="M777.5,290 V326" marker-end="url(#ah)"/>
  <rect x="670" y="328" width="215" height="142" rx="12" fill="#fafafa" stroke="#616161" stroke-width="2"/>
  <text class="h" x="777.5" y="361" text-anchor="middle">VehicleCmd</text>
  <text class="s" x="686" y="394">steer</text>
  <text class="s" x="869" y="394" text-anchor="end">−1 to 1</text>
  <text class="s" x="686" y="422">throttle</text>
  <text class="s" x="869" y="422" text-anchor="end">0 to 0.75</text>
  <text class="s" x="686" y="450">brake</text>
  <text class="s" x="869" y="450" text-anchor="end">0 to 1</text>

  <!-- Legend -->
  <rect x="15" y="430" width="28" height="19" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2"/>
  <text class="s" x="53" y="446">frozen: the weights do not change</text>
  <rect x="15" y="463" width="28" height="19" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="2.2"/>
  <text class="s" x="53" y="479">trained: the only weights you train</text>
</svg>
