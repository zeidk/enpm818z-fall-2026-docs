<!-- Hand-written docs-only panel (its code: _static/l10w/l10w-extra.js). -->
<div class="l10w mathjax_ignore tex2jax_ignore" data-w="x-delay">
<div class="l10w-title"><span class="l10w-kick">Try it</span>Watch the wheel answer late: delay, then lag</div>
<div class="l10w-in">
<div class="row" id="xd-model"><span class="lbl">steering</span></div>
<div class="row"><span class="lbl">time after the command \(t\) (s)</span><input type="range" id="xd-t" min="-0.1" max="1.2" step="0.01" value="0.4" aria-label="the time after the command, seconds"><button id="xd-play">Play the jump</button></div>
<svg id="xd-svg" class="plot" viewBox="0 0 1100 330" style="width:calc(1100 * var(--u));max-width:100%;height:auto;display:block;margin:calc(6 * var(--u)) auto" role="img" aria-label="Left, a graph of the steering angle as a share of the new commanded angle, from 0 to 1, against the time after the command, from minus 0.1 to 1.2 seconds. A gray dashed line, the command, jumps from 0 to 1 at t = 0. A black line, the wheel's angle, stays at 0 for the delay, dark tag 1, then rises toward 1; dark tag 2 marks it one time constant after it starts to move, at 0.63. A teal line and dot mark the time you set. Right, the front wheel seen from above, turning toward the commanded angle, dashed, by the share it has reached."></svg>
<div class="mathout" id="xd-read"></div>
</div>
</div>
